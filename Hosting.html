<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ProWeb Publisher (Firebase Live)</title>
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* --- CSS Styles --- */
        :root {
            --primary: #6366f1; --primary-dark: #4f46e5; --secondary: #ec4899;
            --bg-body: #f8fafc; --bg-card: #ffffff; --text-main: #1e293b; --text-muted: #64748b;
            --border: #e2e8f0; --radius: 16px; --shadow: 0 4px 20px rgba(0,0,0,0.05);
            --nav-height: 70px; --header-height: 60px;
        }
        body.dark-mode {
            --bg-body: #0f172a; --bg-card: #1e293b; --text-main: #f1f5f9; --text-muted: #94a3b8; --border: #334155; --shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-body); color: var(--text-main); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
        
        /* Helper to hide UI for viewer mode */
        .hidden { display: none !important; }

        /* Header */
        header { height: var(--header-height); background: var(--bg-card); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; z-index: 100; }
        .logo { font-weight: 800; font-size: 1.2rem; background: linear-gradient(135deg, var(--primary), var(--secondary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .header-actions i { font-size: 1.2rem; color: var(--text-main); padding: 10px; cursor: pointer; }

        /* Main Content */
        main { flex: 1; overflow-y: auto; padding: 20px; padding-bottom: calc(var(--nav-height) + 20px); position: relative; }
        .page { display: none; animation: slideUp 0.3s ease-out; }
        .page.active { display: block; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* Dashboard */
        .stats-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 25px; }
        .stat-card { background: var(--bg-card); padding: 20px; border-radius: var(--radius); box-shadow: var(--shadow); text-align: center; border: 1px solid var(--border); }
        .stat-num { font-size: 1.8rem; font-weight: 700; color: var(--primary); }
        .stat-label { font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
        .section-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 15px; display: flex; justify-content: space-between; }
        
        .project-card { background: var(--bg-card); border-radius: var(--radius); padding: 15px; margin-bottom: 15px; box-shadow: var(--shadow); border: 1px solid var(--border); position: relative; }
        .project-card::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--primary); }
        .p-header { display: flex; justify-content: space-between; margin-bottom: 10px; }
        .p-title { font-weight: 600; font-size: 1rem; }
        .p-status { font-size: 0.7rem; background: #dcfce7; color: #166534; padding: 2px 8px; border-radius: 10px; font-weight: 600; }
        .p-link { font-size: 0.8rem; color: var(--primary); margin-bottom: 15px; display: block; word-break: break-all; }
        .p-actions { display: flex; gap: 10px; }

        /* Editor */
        .editor-container { display: flex; flex-direction: column; height: calc(100vh - 180px); gap: 15px; }
        .input-group { background: var(--bg-card); padding: 15px; border-radius: var(--radius); border: 1px solid var(--border); box-shadow: var(--shadow); }
        .input-group input { width: 100%; border: none; background: transparent; font-size: 1.1rem; font-weight: 600; outline: none; color: var(--text-main); }
        .code-area-wrapper { flex: 1; background: var(--bg-card); border-radius: var(--radius); border: 1px solid var(--border); overflow: hidden; display: flex; flex-direction: column; }
        .code-tabs { display: flex; background: var(--bg-body); border-bottom: 1px solid var(--border); }
        .code-tab { flex: 1; text-align: center; padding: 12px; font-size: 0.9rem; color: var(--text-muted); cursor: pointer; }
        .code-tab.active { color: var(--primary); border-bottom: 2px solid var(--primary); background: var(--bg-card); }
        .code-content { flex: 1; position: relative; }
        #html-editor { width: 100%; height: 100%; border: none; padding: 15px; font-family: 'Fira Code', monospace; font-size: 14px; background: var(--bg-card); color: var(--text-main); resize: none; outline: none; }
        #preview-frame { width: 100%; height: 100%; border: none; background: white; display: none; }

        /* FAB & Nav */
        .fab { position: fixed; bottom: calc(var(--nav-height) + 20px); right: 20px; width: 60px; height: 60px; border-radius: 50%; background: linear-gradient(135deg, var(--primary), var(--secondary)); color: white; border: none; box-shadow: 0 10px 25px rgba(99, 102, 241, 0.4); font-size: 1.5rem; cursor: pointer; z-index: 90; display: flex; align-items: center; justify-content: center; transition: transform 0.2s; }
        .fab:active { transform: scale(0.95); }
        
        nav.bottom-nav { height: var(--nav-height); background: var(--bg-card); border-top: 1px solid var(--border); display: flex; justify-content: space-around; align-items: center; position: fixed; bottom: 0; width: 100%; z-index: 100; padding-bottom: env(safe-area-inset-bottom); }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: var(--text-muted); font-size: 0.7rem; gap: 5px; cursor: pointer; width: 60px; }
        .nav-item i { font-size: 1.4rem; margin-bottom: 2px; transition: 0.2s; }
        .nav-item.active { color: var(--primary); }
        .nav-item.active i { transform: translateY(-3px); }

        /* Buttons */
        .btn { padding: 10px 20px; border-radius: 10px; border: none; font-weight: 600; font-size: 0.9rem; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; transition: 0.2s; }
        .btn-primary { background: var(--primary); color: white; width: 100%; justify-content: center; padding: 14px; font-size: 1rem; box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3); }
        .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text-main); flex: 1; justify-content: center; }
        .btn-sm { padding: 6px 12px; font-size: 0.8rem; }

        /* Modal */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 200; display: none; align-items: center; justify-content: center; backdrop-filter: blur(5px); }
        .modal { background: var(--bg-card); width: 90%; max-width: 400px; padding: 25px; border-radius: 24px; text-align: center; animation: popIn 0.3s; }
        .modal-icon { font-size: 3rem; margin-bottom: 15px; }
        .url-box { background: var(--bg-body); padding: 15px; border-radius: 12px; border: 1px dashed var(--primary); margin: 20px 0; word-break: break-all; font-family: monospace; color: var(--primary); }
        @keyframes popIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        /* Toast */
        #toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #333; color: white; padding: 12px 24px; border-radius: 50px; font-size: 0.9rem; z-index: 300; opacity: 0; pointer-events: none; transition: 0.3s; box-shadow: 0 5px 15px rgba(0,0,0,0.2); display: flex; align-items: center; gap: 10px; }
        #toast.show { top: 40px; opacity: 1; }

        /* Loader */
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid var(--primary); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 50px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        @media (min-width: 768px) {
            body { max-width: 480px; margin: 0 auto; border-left: 1px solid var(--border); border-right: 1px solid var(--border); }
            nav.bottom-nav { max-width: 480px; left: 50%; transform: translateX(-50%); }
            .fab { right: calc(50% - 220px); }
        }
    </style>
</head>
<body>

    <!-- APP UI (Hidden if Viewer Mode) -->
    <div id="app-ui">
        <header>
            <div class="logo"><i class="fas fa-fire" style="color:#fca5a5"></i> FirePublisher</div>
            <div class="header-actions">
                <i class="fas fa-moon" onclick="toggleTheme()"></i>
                <i class="fas fa-cog"></i>
            </div>
        </header>

        <main>
            <!-- Dashboard Page -->
            <div id="page-dashboard" class="page active">
                <div class="stats-row">
                    <div class="stat-card">
                        <div class="stat-num" id="total-sites">0</div>
                        <div class="stat-label">Live Sites</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-num">∞</div>
                        <div class="stat-label">Global Views</div>
                    </div>
                </div>

                <div class="section-title">
                    <span>My Published Sites</span>
                    <i class="fas fa-sync-alt" onclick="window.loadProjectsFromFirebase()" style="color:var(--text-muted)"></i>
                </div>

                <div id="project-list">
                    <!-- Projects injected via JS -->
                    <div style="text-align: center; padding: 40px 20px; color: var(--text-muted);">
                        <i class="fas fa-cloud-upload-alt" style="font-size: 3rem; margin-bottom: 15px; opacity: 0.3;"></i>
                        <p>Loading from Firebase...</p>
                    </div>
                </div>
            </div>

            <!-- Editor Page -->
            <div id="page-editor" class="page">
                <div class="editor-container">
                    <div class="input-group">
                        <input type="text" id="site-title" placeholder="Enter Website Title...">
                    </div>

                    <div class="code-area-wrapper">
                        <div class="code-tabs">
                            <div class="code-tab active" onclick="switchTab('code')"><i class="fas fa-code"></i> Code</div>
                            <div class="code-tab" onclick="switchTab('preview')"><i class="fas fa-eye"></i> Preview</div>
                        </div>
                        <div class="code-content">
                            <textarea id="html-editor" spellcheck="false"></textarea>
                            <iframe id="preview-frame"></iframe>
                        </div>
                    </div>

                    <div class="p-actions">
                        <button class="btn btn-outline" onclick="downloadCode()"><i class="fas fa-download"></i> Export</button>
                        <button class="btn btn-primary" onclick="window.publishSite()" style="flex:2"><i class="fas fa-cloud-upload-alt"></i> Publish to Web</button>
                    </div>
                </div>
            </div>
        </main>

        <button class="fab" onclick="openNewProject()" id="fab-btn">
            <i class="fas fa-plus"></i>
        </button>

        <nav class="bottom-nav">
            <div class="nav-item active" onclick="switchPage('dashboard', this)">
                <i class="fas fa-home"></i>
                <span>Home</span>
            </div>
            <div class="nav-item" onclick="openNewProject()">
                <i class="fas fa-plus-circle" style="font-size: 2rem; color: var(--primary); transform: translateY(-5px);"></i>
                <span style="opacity:0">Create</span>
            </div>
            <div class="nav-item" onclick="switchPage('editor', this)">
                <i class="fas fa-edit"></i>
                <span>Editor</span>
            </div>
        </nav>

        <!-- Publish Modal -->
        <div class="modal-overlay" id="publish-modal">
            <div class="modal">
                <div class="modal-icon">🚀</div>
                <h2 style="margin-bottom: 10px;">Published Live!</h2>
                <p style="color: var(--text-muted); font-size: 0.9rem;">Your site is now on the web.</p>
                
                <div class="url-box" id="generated-url">Generating...</div>
                
                <p style="font-size: 0.75rem; color: var(--text-muted); margin-bottom: 20px;">
                    This link works immediately. Share it anywhere!
                </p>

                <div style="display: flex; gap: 10px;">
                    <button class="btn btn-outline" onclick="closeModal()">Close</button>
                    <button class="btn btn-primary" onclick="copyLink()">Copy Link</button>
                </div>
            </div>
        </div>

        <div id="toast"><i class="fas fa-check-circle" style="color: #4ade80;"></i> <span>Message</span></div>
    </div>

    <!-- Firebase Module Script (Fixes Import Error) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getDatabase, ref, push, onValue, remove, set } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";

        // --- YOUR FIREBASE CONFIGURATION ---
        const firebaseConfig = {
            apiKey: "AIzaSyDB-n_KuqxTmcTKq1tnsUcz4KL_rhUXsrE",
            authDomain: "hosting-ded42.firebaseapp.com",
            databaseURL: "https://hosting-ded42-default-rtdb.firebaseio.com",
            projectId: "hosting-ded42",
            storageBucket: "hosting-ded42.firebasestorage.app",
            messagingSenderId: "959916773846",
            appId: "1:959916773846:web:e416bd60d85a87fa225477",
            measurementId: "G-7912HKHN57"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // --- VIEWER MODE LOGIC ---
        const urlParams = new URLSearchParams(window.location.search);
        const projectId = urlParams.get('id');

        if (projectId) {
            // Hide App UI immediately
            document.getElementById('app-ui').classList.add('hidden');
            document.body.innerHTML = '<div class="loader"></div>';
            document.body.style.display = 'block';
            document.body.style.height = '100vh';
            document.body.style.margin = '0';
            
            const projectRef = ref(db, 'projects/' + projectId);
            onValue(projectRef, (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    document.open();
                    document.write(data.code);
                    document.close();
                } else {
                    document.body.innerHTML = '<h2 style="text-align:center; margin-top:50px; color:var(--text-main)">Site not found or deleted!</h2>';
                }
            }, (error) => {
                document.body.innerHTML = `<h2 style="text-align:center; margin-top:50px; color:red">Error: ${error.message}</h2>`;
            });
        } else {
            // --- EDITOR MODE LOGIC (Expose functions to window) ---
            
            // 1. Load Projects
            window.loadProjectsFromFirebase = function() {
                const projectsRef = ref(db, 'projects');
                onValue(projectsRef, (snapshot) => {
                    const data = snapshot.val();
                    const projects = [];
                    if (data) {
                        Object.keys(data).forEach(key => {
                            projects.push({ id: key, ...data[key] });
                        });
                    }
                    // Sort newest first
                    projects.sort((a, b) => b.createdAt - a.createdAt);
                    renderProjectList(projects);
                });
            };

            // 2. Publish Site
            window.publishSite = async function() {
                const title = document.getElementById('site-title').value || 'Untitled';
                const code = document.getElementById('html-editor').value;
                
                const btn = document.querySelector('.btn-primary'); // visual feedback
                const originalText = btn.innerHTML;
                btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Publishing...';
                
                try {
                    const projectsRef = ref(db, 'projects');
                    const newProjectRef = push(projectsRef);
                    
                    await set(newProjectRef, {
                        title: title,
                        code: code,
                        createdAt: Date.now()
                    });

                    const baseUrl = window.location.protocol + "//" + window.location.host + window.location.pathname;
                    const liveUrl = baseUrl + "?id=" + newProjectRef.key;
                    
                    document.getElementById('generated-url').innerText = liveUrl;
                    document.getElementById('publish-modal').style.display = 'flex';
                } catch (error) {
                    alert("Publishing Failed: " + error.message);
                } finally {
                    btn.innerHTML = originalText;
                }
            };

            // 3. Delete Site
            window.deleteSite = async function(id) {
                if(!confirm("Are you sure you want to delete this site?")) return;
                try {
                    await remove(ref(db, 'projects/' + id));
                    showToast('Site deleted successfully');
                } catch (error) {
                    alert("Delete Failed: " + error.message);
                }
            };

            // Initial Load
            window.loadProjectsFromFirebase();
        }

        // Helper to render list (must be in module scope to access window, or global)
        function renderProjectList(projects) {
            const list = document.getElementById('project-list');
            document.getElementById('total-sites').innerText = projects.length;
            list.innerHTML = '';

            if(projects.length === 0) {
                list.innerHTML = `<div style="text-align: center; padding: 40px 20px; color: var(--text-muted);"><p>No projects found. Create one!</p></div>`;
                return;
            }

            projects.forEach(p => {
                const baseUrl = window.location.protocol + "//" + window.location.host + window.location.pathname;
                const link = baseUrl + "?id=" + p.id;

                const item = document.createElement('div');
                item.className = 'project-card';
                item.innerHTML = `
                    <div class="p-header">
                        <span class="p-title">${p.title}</span>
                        <span class="p-status">Live</span>
                    </div>
                    <span class="p-link">${link}</span>
                    <div class="p-actions">
                        <button class="btn btn-outline btn-sm" onclick="window.open('${link}', '_blank')"><i class="fas fa-eye"></i> View</button>
                        <button class="btn btn-outline btn-sm" onclick="window.deleteSite('${p.id}')"><i class="fas fa-trash"></i></button>
                    </div>
                `;
                list.appendChild(item);
            });
        }
    </script>

    <!-- Client Side UI Script -->
    <script>
        let state = { darkMode: localStorage.getItem('theme') === 'dark' };

        document.addEventListener('DOMContentLoaded', () => {
            if(state.darkMode) document.body.classList.add('dark-mode');
            
            // Default Code
            const defaultCode = `<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body { font-family: sans-serif; text-align: center; padding: 20px; background: #f0fdf4; color: #166534; }
  h1 { margin-top: 50px; }
  .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-top: 20px; }
  button { background: #166534; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; margin-top: 10px; }
</style>
</head>
<body>
  <h1>My Live Site</h1>
  <p>Hosted on Firebase!</p>
  <div class="card">
    <p>This is your content.</p>
    <button onclick="alert('Hello!')">Click Me</button>
  </div>
</body>
</html>`;
            
            // Only set editor if we are in editor mode (not viewer mode)
            const editor = document.getElementById('html-editor');
            if(editor) {
                editor.value = defaultCode;
                editor.addEventListener('input', updatePreview);
            }
        });

        // --- UI Functions ---
        function switchPage(pageId, navEl) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById('page-' + pageId).classList.add('active');
            if(navEl) {
                document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
                navEl.classList.add('active');
            }
            const fab = document.getElementById('fab-btn');
            fab.style.display = (pageId === 'dashboard') ? 'flex' : 'none';
        }

        function openNewProject() {
            document.getElementById('site-title').value = '';
            document.getElementById('html-editor').value = '';
            switchTab('code');
            switchPage('editor', document.querySelectorAll('.nav-item')[2]);
        }

        function switchTab(tab) {
            const editor = document.getElementById('html-editor');
            const preview = document.getElementById('preview-frame');
            const tabs = document.querySelectorAll('.code-tab');
            if (tab === 'code') {
                editor.style.display = 'block'; preview.style.display = 'none';
                tabs[0].classList.add('active'); tabs[1].classList.remove('active');
            } else {
                editor.style.display = 'none'; preview.style.display = 'block';
                updatePreview();
                tabs[0].classList.remove('active'); tabs[1].classList.add('active');
            }
        }

        function updatePreview() {
            const frame = document.getElementById('preview-frame');
            if(frame) frame.srcdoc = document.getElementById('html-editor').value;
        }

        function copyLink() {
            const url = document.getElementById('generated-url').innerText;
            navigator.clipboard.writeText(url).then(() => showToast('Link copied!'));
        }

        function closeModal() {
            document.getElementById('publish-modal').style.display = 'none';
            switchPage('dashboard', document.querySelectorAll('.nav-item')[0]);
            window.loadProjectsFromFirebase(); // Refresh list
        }

        function downloadCode() {
            const code = document.getElementById('html-editor').value;
            const blob = new Blob([code], {type: "text/html"});
            const a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = "site.html";
            a.click();
        }

        function toggleTheme() {
            state.darkMode = !state.darkMode;
            localStorage.setItem('theme', state.darkMode ? 'dark' : 'light');
            document.body.classList.toggle('dark-mode');
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.querySelector('span').innerText = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 3000);
        }
    </script>
</body>
</html>
